<svg xml:space="preserve" width="480" height="230" viewBox="0 0 480 230" xmlns="http://www.w3.org/2000/svg">
<style>
text {
  font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 13px;
  fill: #00ff41;
  white-space: pre;
}
.title  { fill: #7dff9a; font-size: 12px; }
.prompt { fill: #00ff41; font-weight: 700; }
.cmd    { fill: #d8ffe0; }
.key    { fill: #00c72c; }
.dots   { fill: #1f5f2c; }
.val    { fill: #b6ffc6; font-weight: 700; }

.line {
  opacity: 0;
  animation: boot 0.35s ease-out forwards;
}
@keyframes boot {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}

.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.scan { animation: scan 6s linear infinite; }
@keyframes scan {
  from { transform: translateY(-40px); }
  to   { transform: translateY(250px); }
}
</style>
<defs>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff41" stop-opacity="0" />
    <stop offset="1" stop-color="#00ff41" stop-opacity="0.06" />
  </linearGradient>
  <clipPath id="frame"><rect x="1" y="1" width="478" height="228" rx="8" /></clipPath>
</defs>

<g clip-path="url(#frame)">
  <rect x="0" y="0" width="480" height="230" fill="#0a0f0a" />
  <rect x="0" y="0" width="480" height="28" fill="#0f1a10" />
  <rect class="scan" x="0" y="0" width="480" height="40" fill="url(#scanGrad)" />
</g>
<rect x="0.5" y="0.5" width="479" height="229" rx="8" fill="none" stroke="#00ff41" stroke-opacity="0.35" />
<line x1="0" y1="28" x2="480" y2="28" stroke="#00ff41" stroke-opacity="0.2" />

<circle cx="16" cy="14" r="5" fill="#ff5f56" />
<circle cx="32" cy="14" r="5" fill="#ffbd2e" />
<circle cx="48" cy="14" r="5" fill="#27c93f" />
<text class="title" x="240" y="18" text-anchor="middle">natalieconan@github: ~/stats</text>

<text x="18" y="54" class="line"><tspan class="prompt">$ </tspan><tspan class="cmd">gh stats --user natalieconan --all-time</tspan></text>
<text x="30" y="78" class="line" style="animation-delay: 120ms"><tspan class="key">stars</tspan><tspan class="dots"> ................. </tspan><tspan class="val">4</tspan></text>
<text x="30" y="99" class="line" style="animation-delay: 240ms"><tspan class="key">forks</tspan><tspan class="dots"> ................. </tspan><tspan class="val">0</tspan></text>
<text x="30" y="120" class="line" style="animation-delay: 360ms"><tspan class="key">contributions</tspan><tspan class="dots"> ......... </tspan><tspan class="val">2,395</tspan></text>
<text x="30" y="141" class="line" style="animation-delay: 480ms"><tspan class="key">lines_changed</tspan><tspan class="dots"> ......... </tspan><tspan class="val">+0 / -0</tspan></text>
<text x="30" y="162" class="line" style="animation-delay: 600ms"><tspan class="key">views_14d</tspan><tspan class="dots"> ............. </tspan><tspan class="val">31</tspan></text>
<text x="30" y="183" class="line" style="animation-delay: 720ms"><tspan class="key">repos_contributed</tspan><tspan class="dots"> ..... </tspan><tspan class="val">25</tspan></text>

<text x="18" y="207" class="line" style="animation-delay: 840ms"><tspan class="prompt">$ </tspan><tspan class="cursor">█</tspan></text>
</svg>
