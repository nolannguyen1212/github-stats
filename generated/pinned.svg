.line {
  opacity: 0;
  animation: boot 0.4s ease-out forwards;
}
@keyframes boot {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
