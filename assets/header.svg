  <clipPath id="l5"><rect x="0" y="160" height="26" width="0"><animate attributeName="width" from="0" to="520" begin="3.3s" dur="0.9s" fill="freeze" /></rect></clipPath>
  <clipPath id="l6"><rect x="0" y="186" height="26" width="0"><animate attributeName="width" from="0" to="980" begin="4.3s" dur="0.01s" fill="freeze" /></rect></clipPath>
