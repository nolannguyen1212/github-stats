<svg xml:space="preserve" width="980" height="250" viewBox="0 0 980 250" xmlns="http://www.w3.org/2000/svg">
<!--
  Static header for the profile README. Edit the <text> contents below.
  Each line is revealed by animating the width of its clip rect (SMIL), so
  if you change a line's length, adjust the matching `to="..."` width:
  roughly 8.4px per character at 14px monospace.
-->
<style>
text {
  font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 14px;
  fill: #00ff41;
}
.title  { fill: #7dff9a; font-size: 12px; }
.prompt { fill: #00ff41; font-weight: 700; }
.path   { fill: #00c72c; }
.cmd    { fill: #d8ffe0; }
.out    { fill: #b6ffc6; }
.dim    { fill: #3c8c4b; }
.hl     { fill: #00ff41; font-weight: 700; }
.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.rain   { fill: #00ff41; font-size: 12px; opacity: 0.12; }
</style>
